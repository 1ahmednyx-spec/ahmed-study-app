name: Study Platform browser smoke tests

on:
  push:
    branches:
      - phase-1-ui-foundation
      - phase-2-modular-foundation
      - feature/subjects-2027-on-main
      - feature/past-exam-archive
      - fix/service-worker-static-cache
  pull_request:
    branches:
      - main
      - phase-1-ui-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: study-platform-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local web server
        run: |
          python3 -m http.server 4173 --bind 0.0.0.0 > /tmp/ahmed-study-http.log 2>&1 &
          echo $! > /tmp/ahmed-study-http.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ahmed-study-http.log
          exit 1
      - name: Run browser smoke tests
        run: node tests/ui-smoke.mjs
