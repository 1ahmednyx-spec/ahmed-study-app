[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/db/health"
  to = "/.netlify/functions/db-health"
  status = 200

[[redirects]]
  from = "/api/db/subjects"
  to = "/.netlify/functions/db-subjects"
  status = 200

[[redirects]]
  from = "/api/db/subjects/:id/lessons"
  to = "/.netlify/functions/db-lessons?id=:id"
  status = 200
